<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AEGIS // Live Threat Monitor</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root {
    color-scheme: dark;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden; /* Prevent all scrollbars */
    background: #04060a;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .ltm-mono {
    font-family: 'JetBrains Mono', "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  /* ---------------------------------------------------------------- */
  /* Fullscreen Section                                                */
  /* ---------------------------------------------------------------- */
  .ltm-section {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: #04060a;
    overflow: hidden;
    user-select: none;
  }

  .ltm-scan {
    pointer-events: none;
    position: absolute;
    inset: 0;
    opacity: 0.04;
    background-image: repeating-linear-gradient(
      to bottom,
      rgba(0, 242, 255, 0.4) 0px,
      rgba(0, 242, 255, 0.4) 1px,
      transparent 1px,
      transparent 3px
    );
    background-size: 100% 6px;
    animation: ltm-scan-move 9s linear infinite;
  }
  @keyframes ltm-scan-move {
    0% { background-position: 0 0; }
    100% { background-position: 0 240px; }
  }

  .ltm-wrap {
    position: absolute;
    inset: 0;
    cursor: grab;
  }
  .ltm-wrap.dragging { cursor: grabbing; }
  .ltm-canvas-inner {
    width: 100%;
    height: 100%;
    transform-origin: center center;
  }
  .ltm-canvas-inner.ltm-inner-smooth {
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .ltm-canvas-inner canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ---------------------------------------------------------------- */
  /* Top-left label + status                                          */
  /* ---------------------------------------------------------------- */
  .ltm-topleft {
    position: absolute;
    top: 14px;
    left: 14px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(8, 12, 20, 0.75);
    border: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 5px 10px;
    border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  .ltm-label {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: #00f2ff;
  }
  .ltm-status {
    display: flex;
    align-items: center;
    gap: 5px;
    padding-left: 6px;
    border-left: 1px solid rgba(255, 255, 255, 0.1);
  }
  .ltm-dot-wrap {
    position: relative;
    display: flex;
    height: 5px;
    width: 5px;
  }
  .ltm-dot-ping {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    background: #34d399;
    opacity: 0.6;
    animation: ltm-ping 1.6s cubic-bezier(0,0,0.2,1) infinite;
  }
  .ltm-dot-core {
    position: relative;
    height: 5px;
    width: 5px;
    border-radius: 999px;
    background: #34d399;
  }
  @keyframes ltm-ping {
    75%, 100% { transform: scale(2.2); opacity: 0; }
  }
  .ltm-status-text {
    font-size: 9px;
    letter-spacing: 0.08em;
    color: rgba(110,231,183,0.9);
  }

  @media (prefers-reduced-motion: reduce) {
    .ltm-scan { display: none; }
    .ltm-dot-ping { animation: none; display: none; }
  }

  /* ---------------------------------------------------------------- */
  /* Zoom controls                                                     */
  /* ---------------------------------------------------------------- */
  .ltm-zoom {
    position: absolute;
    bottom: 14px;
    left: 14px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .ltm-zoom button {
    height: 24px;
    width: 24px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(8, 12, 20, 0.75);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: rgba(255,255,255,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background-color .15s, color .15s;
    padding: 0;
  }
  .ltm-zoom button:hover {
    background: rgba(255,255,255,0.15);
    color: #fff;
  }
  .ltm-zoom button.ltm-hidden { display: none; }

  /* ---------------------------------------------------------------- */
  /* Stat counters                                                     */
  /* ---------------------------------------------------------------- */
  .ltm-stats {
    position: absolute;
    top: 14px;
    right: 14px;
    z-index: 10;
    display: grid;
    grid-template-columns: repeat(4, auto);
    column-gap: 14px;
    row-gap: 4px;
    text-align: right;
    background: rgba(8, 12, 20, 0.75);
    border: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 5px 12px;
    border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  .ltm-stat-item {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }
  .ltm-stat-value {
    font-size: 13px;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    display: inline-block;
    transition: text-shadow 0.3s ease;
  }
  .ltm-stat-value.ltm-flash {
    animation: ltm-flash 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes ltm-flash {
    0% { transform: scale(1); }
    30% { transform: scale(1.12); text-shadow: 0 0 10px currentColor; }
    100% { transform: scale(1); text-shadow: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ltm-stat-value.ltm-flash { animation: none; }
    .ltm-canvas-inner.ltm-inner-smooth { transition: none; }
  }
  .ltm-stat-label {
    margin-top: 2px;
    font-size: 7.5px;
    letter-spacing: 0.1em;
    color: rgba(255,255,255,0.4);
  }

  /* ---------------------------------------------------------------- */
  /* Feed panel (desktop)                                              */
  /* ---------------------------------------------------------------- */
  .ltm-feed {
    display: none;
    position: absolute;
    bottom: 14px;
    right: 14px;
    z-index: 10;
    width: 230px;
    flex-direction: column;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(8, 12, 20, 0.85);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    box-shadow: 0 12px 32px rgba(0,0,0,0.5);
  }
  @media (min-width: 768px) {
    .ltm-feed { display: flex; }
  }
  .ltm-feed-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 10px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .ltm-feed-title {
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: 0.16em;
    color: rgba(255,255,255,0.4);
  }
  .ltm-feed-time {
    font-size: 8.5px;
    color: #00f2ff;
  }
  .ltm-feed-body {
    max-height: 150px;
    overflow: hidden;
    padding: 4px;
  }
  .ltm-feed-row {
    display: flex;
    align-items: center;
    gap: 6px;
    border-radius: 4px;
    padding: 4px 6px;
    animation: ltm-row-in .22s ease-out;
  }
  .ltm-feed-row:hover { background: rgba(255,255,255,0.04); }
  @keyframes ltm-row-in {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .ltm-feed-dot {
    height: 5px;
    width: 5px;
    border-radius: 999px;
    flex-shrink: 0;
  }
  .ltm-feed-main { min-width: 0; flex: 1; }
  .ltm-feed-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 6px;
  }
  .ltm-feed-type {
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: rgba(255,255,255,0.85);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ltm-feed-when {
    font-size: 8.5px;
    color: rgba(255,255,255,0.3);
    flex-shrink: 0;
  }
  .ltm-feed-route {
    font-size: 8.5px;
    color: rgba(255,255,255,0.4);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ltm-feed-empty {
    padding: 16px 6px;
    text-align: center;
    font-size: 9.5px;
    color: rgba(255,255,255,0.25);
  }

  /* ---------------------------------------------------------------- */
  /* Mobile ticker                                                     */
  /* ---------------------------------------------------------------- */
  .ltm-ticker {
    display: flex;
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    width: auto;
    max-width: 85%;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(8, 12, 20, 0.85);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    padding: 4px 10px;
    align-items: center;
    gap: 6px;
    font-size: 9.5px;
    white-space: nowrap;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }
  @media (min-width: 768px) {
    .ltm-ticker { display: none; }
  }
  .ltm-ticker-dot {
    height: 5px;
    width: 5px;
    border-radius: 999px;
    flex-shrink: 0;
  }
  .ltm-ticker-type { color: rgba(255,255,255,0.85); flex-shrink: 0; font-weight: 600; font-size: 9.5px; }
  .ltm-ticker-route {
    color: rgba(255,255,255,0.45);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 9px;
  }

  /* ---------------------------------------------------------------- */
  /* Tooltip                                                           */
  /* ---------------------------------------------------------------- */
  .ltm-tooltip {
    pointer-events: none;
    position: absolute;
    z-index: 20;
    transform: translate(-50%, calc(-100% - 6px));
    border-radius: 8px;
    border: 1px solid rgba(0, 242, 255, 0.3);
    background: rgba(8, 12, 20, 0.95);
    padding: 8px 12px;
    font-size: 12px;
    color: rgba(255,255,255,0.9);
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .ltm-tooltip.visible {
    opacity: 1;
    transform: translate(-50%, calc(-100% - 10px));
  }
  .ltm-tooltip-title { font-weight: 600; font-size: 12.5px; color: #fff; }
  .ltm-tooltip-line {
    margin-top: 2px;
    font-size: 10.5px;
    color: rgba(255,255,255,0.45);
  }
</style>
</head>

  <div class="ltm-feed">

</section>

    { id: "waw", name: "Warsaw", lat: 52.2, lon: 21.0 },
    { id: "kyi", name: "Kyiv", lat: 50.4, lon: 30.5 },
    { id: "mos", name: "Moscow", lat: 55.8, lon: 37.6 },
    { id: "ist", name: "Istanbul", lat: 41.0, lon: 28.9 },
    // Africa & Middle East
    { id: "cai", name: "Cairo", lat: 30.0, lon: 31.2 },
    { id: "lag", name: "Lagos", lat: 6.5, lon: 3.4 },
    { id: "nai", name: "Nairobi", lat: -1.28, lon: 36.8 },
    { id: "joh", name: "Johannesburg", lat: -26.2, lon: 28.0 },
    { id: "cas", name: "Casablanca", lat: 33.5, lon: -7.5 },
    { id: "dub", name: "Dubai", lat: 25.2, lon: 55.3 },
    { id: "ruh", name: "Riyadh", lat: 24.7, lon: 46.6 },
    { id: "tlv", name: "Tel Aviv", lat: 32.0, lon: 34.7 },
    // Asia
    { id: "mum", name: "Mumbai", lat: 19.1, lon: 72.9 },
    { id: "del", name: "Delhi", lat: 28.6, lon: 77.2 },
    { id: "blr", name: "Bengaluru", lat: 12.9, lon: 77.5 },
    { id: "sin", name: "Singapore", lat: 1.35, lon: 103.8 },
    { id: "jak", name: "Jakarta", lat: -6.2, lon: 106.8 },
    { id: "bgk", name: "Bangkok", lat: 13.7, lon: 100.5 },
    { id: "mnl", name: "Manila", lat: 14.5, lon: 120.9 },
    { id: "hkg", name: "Hong Kong", lat: 22.3, lon: 114.1 },
    { id: "tpe", name: "Taipei", lat: 25.0, lon: 121.5 },
    { id: "sha", name: "Shanghai", lat: 31.2, lon: 121.5 },
    { id: "bei", name: "Beijing", lat: 39.9, lon: 116.4 },
    { id: "seo", name: "Seoul", lat: 37.6, lon: 127.0 },
    { id: "tok", name: "Tokyo", lat: 35.7, lon: 139.7 },
    { id: "osa", name: "Osaka", lat: 34.6, lon: 135.5 },
    // Oceania
    { id: "syd", name: "Sydney", lat: -33.9, lon: 151.2 },
    { id: "mel", name: "Melbourne", lat: -37.8, lon: 144.9 },
    { id: "akl", name: "Auckland", lat: -36.8, lon: 174.7 },
    { id: "per", name: "Perth", lat: -31.9, lon: 115.8 }
  ];

  var THREAT_TYPES = ["RANSOMWARE", "BOTNET", "PHISHING", "MALWARE", "DDoS", "BRUTE FORCE"];

  var BASE_SEVERITY = {
    RANSOMWARE: "CRITICAL",
    DDoS: "HIGH",
    BOTNET: "MEDIUM",
    "BRUTE FORCE": "MEDIUM",
    PHISHING: "LOW",
    MALWARE: "LOW"
  };

  var SEVERITY_COLOR = {
    CRITICAL: "#FB5459",
    HIGH: "#F6A64B",
    MEDIUM: "#2DD4E8",
    LOW: "#4C8DF6"
  };

  var SEVERITY_ORDER = ["LOW", "MEDIUM", "HIGH", "CRITICAL"];

  function jitterSeverity(base) {
    var idx = SEVERITY_ORDER.indexOf(base);
    var roll = Math.random();
    var next = idx;
    if (roll < 0.18) next = idx - 1;
    else if (roll > 0.85) next = idx + 1;
    next = Math.max(0, Math.min(SEVERITY_ORDER.length - 1, next));
    return SEVERITY_ORDER[next];
  }

  function pickTwoDistinct(arr) {
    var a = arr[Math.floor(Math.random() * arr.length)];
    var b = arr[Math.floor(Math.random() * arr.length)];
    var guard = 0;
    while (b === a && guard++ < 10) {
      b = arr[Math.floor(Math.random() * arr.length)];
    }
    return [a, b];
  }

  function formatClock(d) {
    return d.toLocaleTimeString(undefined, { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }

  function project(lat, lon, width, height) {
    return {
      x: ((lon + 180) / 360) * width,
      y: ((90 - lat) / 180) * height
    };
  }

  function easeInOutCubic(x) {
    return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  }
  function easeOutCubic(x) {
    return 1 - Math.pow(1 - x, 3);
  }
  function easeOutExpo(x) {
    return x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
  }

  var START_COUNTERS = { detected: 148920, blocked: 144810, active: 48, sources: NODES.length };

  // DOM refs
  var section = document.getElementById("ltmSection");
  var wrap = document.getElementById("ltmWrap");
  var inner = document.getElementById("ltmInner");
  var canvas = document.getElementById("ltmCanvas");
  var tooltip = document.getElementById("ltmTooltip");
  var tooltipTitle = document.getElementById("ltmTooltipTitle");
  var statDetected = document.getElementById("statDetected");
  var statBlocked = document.getElementById("statBlocked");
  var statActive = document.getElementById("statActive");
  var statSources = document.getElementById("statSources");
  var feedBody = document.getElementById("feedBody");
  var feedTime = document.getElementById("feedTime");
  var ticker = document.getElementById("ltmTicker");
  var zoomInBtn = document.getElementById("ltmZoomIn");
  var zoomOutBtn = document.getElementById("ltmZoomOut");
  var zoomResetBtn = document.getElementById("ltmZoomReset");

  var ctx = canvas.getContext("2d");
  var landCanvas = null;

  var size = { width: 0, height: 0 };
  var view = { scale: 1, tx: 0, ty: 0 };
  var dragging = false;
  var dragStart = { x: 0, y: 0, tx: 0, ty: 0 };

  var counters = Object.assign({}, START_COUNTERS);
  var feed = [];
  var attacks = [];
  var pulses = [];
  var idCounter = 1;
  var lastSpawn = 0;
  var nextSpawnGap = 200;
  var hoverNode = null;
  var visible = true;
  var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  window.matchMedia("(prefers-reduced-motion: reduce)").addEventListener("change", function (e) {
    reducedMotion = e.matches;
  });

  // Sizing
  function resize() {
    var rect = wrap.getBoundingClientRect();
    size.width = Math.round(rect.width);
    size.height = Math.round(rect.height);
    buildLandLayer();
  }
  var ro = new ResizeObserver(resize);
  ro.observe(wrap);

  function buildLandLayer() {
    var width = size.width, height = size.height;
    if (width === 0 || height === 0) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var land = document.createElement("canvas");
    land.width = width * dpr;
    land.height = height * dpr;
    var lctx = land.getContext("2d");
    lctx.scale(dpr, dpr);

    lctx.strokeStyle = "rgba(120,170,255,0.06)";
    lctx.lineWidth = 1;
    for (var lon = -180; lon <= 180; lon += 30) {
      var px = project(0, lon, width, height).x;
      lctx.beginPath();
      lctx.moveTo(px, 0);
      lctx.lineTo(px, height);
      lctx.stroke();
    }
    for (var lat = -60; lat <= 90; lat += 30) {
      var py = project(lat, 0, width, height).y;
      lctx.beginPath();
      lctx.moveTo(0, py);
      lctx.lineTo(width, py);
      lctx.stroke();
    }

    for (var row = 0; row < LAND_ROWS; row++) {
      for (var col = 0; col < LAND_COLS; col++) {
        if (!isLandCell(row, col)) continue;
        var clat = 90 - (row + 0.5) * (180 / LAND_ROWS);
        var clon = -180 + (col + 0.5) * (360 / LAND_COLS);
        var p = project(clat, clon, width, height);
        var seed = (row * 131 + col * 17) % 100;
        var alpha = 0.12 + (seed / 100) * 0.14;
        lctx.fillStyle = "rgba(0, 242, 255," + alpha.toFixed(3) + ")";
        var r = width < 640 ? 0.9 : 1.2;
        lctx.beginPath();
        lctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        lctx.fill();
      }
    }
    landCanvas = land;
  }

  // Simulation: spawn attacks + feed/counters
  function spawnAttack() {
    var pair = pickTwoDistinct(NODES);
    var from = pair[0], to = pair[1];
    var type = THREAT_TYPES[Math.floor(Math.random() * THREAT_TYPES.length)];
    var severity = jitterSeverity(BASE_SEVERITY[type]);
    var color = SEVERITY_COLOR[severity];
    var attack = {
      id: idCounter++,
      from: from,
      to: to,
      color: color,
      arcBend: (Math.random() - 0.5) * 2.2,
      start: performance.now(),
      duration: 1600 + Math.random() * 1200
    };
    attacks.push(attack);
    if (attacks.length > 70) attacks.splice(0, attacks.length - 70);

    var event = {
      id: attack.id,
      type: type,
      source: from.name,
      target: to.name,
      severity: severity,
      time: formatClock(new Date())
    };
    feed.unshift(event);
    if (feed.length > 6) feed.length = 6;
    renderFeed();
    renderTicker(event);

    counters.detected += 1;
    if (Math.random() < 0.84) counters.blocked += 1;
    counters.active = attacks.length;
    counters.sources = NODES.length;
    renderCounters();
  }

  var prevCounters = Object.assign({}, START_COUNTERS);

  function animateStat(el, from, to, duration) {
    if (from === to || duration <= 0) {
      el.textContent = to.toLocaleString();
      return;
    }
    if (el._rafId) cancelAnimationFrame(el._rafId);
    var startTime = null;
    function step(ts) {
      if (startTime === null) startTime = ts;
      var p = Math.min(1, (ts - startTime) / duration);
      var eased = easeOutCubic(p);
      var val = Math.round(from + (to - from) * eased);
      el.textContent = val.toLocaleString();
      if (p < 1) {
        el._rafId = requestAnimationFrame(step);
      } else {
        el._rafId = null;
        el.classList.add("ltm-flash");
        setTimeout(function () { el.classList.remove("ltm-flash"); }, 500);
      }
    }
    el._rafId = requestAnimationFrame(step);
  }

  function renderCounters() {
    var dur = reducedMotion ? 0 : 450;
    animateStat(statDetected, prevCounters.detected, counters.detected, dur);
    animateStat(statBlocked, prevCounters.blocked, counters.blocked, dur);
    animateStat(statActive, prevCounters.active, counters.active, 250);
    animateStat(statSources, prevCounters.sources, counters.sources, dur);
    prevCounters = Object.assign({}, counters);
  }

  function renderFeed() {
    feedTime.textContent = feed.length ? feed[0].time : "--:--:--";
    if (feed.length === 0) {
      feedBody.innerHTML = '<div class="ltm-feed-empty ltm-mono">awaiting activity&hellip;</div>';
      return;
    }
    feedBody.innerHTML = feed.map(function (ev) {
      var c = SEVERITY_COLOR[ev.severity];
      return (
        '<div class="ltm-feed-row">' +
          '<span class="ltm-feed-dot" style="background:' + c + ';box-shadow:0 0 6px ' + c + '"></span>' +
          '<div class="ltm-feed-main">' +
            '<div class="ltm-feed-top">' +
              '<span class="ltm-feed-type ltm-mono">' + ev.type + '</span>' +
              '<span class="ltm-feed-when ltm-mono">' + ev.time + '</span>' +
            '</div>' +
            '<div class="ltm-feed-route ltm-mono">' + ev.source + ' \u2192 ' + ev.target + '</div>' +
          '</div>' +
        '</div>'
      );
    }).join("");
  }

  function renderTicker(ev) {
    var c = SEVERITY_COLOR[ev.severity];
    ticker.style.display = "flex";
    ticker.innerHTML =
      '<span class="ltm-ticker-dot" style="background:' + c + '"></span>' +
      '<span class="ltm-ticker-type">' + ev.type + '</span>' +
      '<span class="ltm-ticker-route">' + ev.source + ' \u2192 ' + ev.target + '</span>';
  }

  // Main render loop
  function tick(now) {
    requestAnimationFrame(tick);
    if (!visible) return;

    var width = size.width, height = size.height;
    if (width === 0 || height === 0) return;

    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (canvas.width !== width * dpr || canvas.height !== height * dpr) {
      canvas.width = width * dpr;
      canvas.height = height * dpr;
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, width, height);

    var grad = ctx.createRadialGradient(width / 2, height / 2, 0, width / 2, height / 2, Math.max(width, height) * 0.7);
    grad.addColorStop(0, "rgba(10,24,44,0.4)");
    grad.addColorStop(1, "rgba(3,5,8,0)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    if (landCanvas) ctx.drawImage(landCanvas, 0, 0, width, height);

    // Continuous Spawn
    if (now - lastSpawn > nextSpawnGap) {
      lastSpawn = now;
      nextSpawnGap = 120 + Math.random() * 260;
      spawnAttack();
    }

    // Revolving Radar Sweep Animation
    if (!reducedMotion) {
      var radarAngle = (now / 2400) % (Math.PI * 2);
      var cx = width / 2, cy = height / 2;
      var radius = Math.max(width, height) * 0.75;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, radius, radarAngle - 0.45, radarAngle);
      ctx.closePath();
      ctx.fillStyle = "rgba(0, 242, 255, 0.045)";
      ctx.fill();
      ctx.restore();
    }

    // Attack Arcs & Particle Trails Animation
    for (var i = attacks.length - 1; i >= 0; i--) {
      var a = attacks[i];
      var t = (now - a.start) / a.duration;
      if (t >= 1) {
        var p2 = project(a.to.lat, a.to.lon, width, height);
        // Double Shockwave Rings on Impact
        pulses.push({ x: p2.x, y: p2.y, start: now, duration: 900, color: a.color, maxRadius: 22 });
        pulses.push({ x: p2.x, y: p2.y, start: now + 120, duration: 1100, color: a.color, maxRadius: 34 });
        attacks.splice(i, 1);
        continue;
      }
      var p0 = project(a.from.lat, a.from.lon, width, height);
      var p1 = project(a.to.lat, a.to.lon, width, height);
      var mx = (p0.x + p1.x) / 2, my = (p0.y + p1.y) / 2;
      var dx = p1.x - p0.x, dy = p1.y - p0.y;
      var dist = Math.hypot(dx, dy) || 1;
      var nx = -dy / dist, ny = dx / dist;
      var bend = a.arcBend * Math.min(80, dist * 0.28);
      var cxp = mx + nx * bend;
      var cyp = my + ny * bend - Math.min(40, dist * 0.06);

      function bezier(tt) {
        var u = 1 - tt;
        return {
          x: u * u * p0.x + 2 * u * tt * cxp + tt * tt * p1.x,
          y: u * u * p0.y + 2 * u * tt * cyp + tt * tt * p1.y
        };
      }

      var et = easeInOutCubic(t);
      var trailStartLinear = Math.max(0, t - 0.38);
      var trailStart = easeInOutCubic(trailStartLinear);

      ctx.save();
      ctx.strokeStyle = a.color;
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      var steps = 28;
      for (var s = 0; s <= steps; s++) {
        var tt2 = trailStart + ((et - trailStart) * s) / steps;
        var pt = bezier(tt2);
        ctx.globalAlpha = 0.85 * (s / steps);
        if (s === 0) {
          ctx.moveTo(pt.x, pt.y);
        } else {
          ctx.lineTo(pt.x, pt.y);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(pt.x, pt.y);
        }
      }
      ctx.restore();

      // Main Particle Head & Trailing Spark Dots
      var head = bezier(et);
      var headPulse = 1 + Math.sin(now / 90 + a.id) * 0.22;
      ctx.save();
      ctx.shadowBlur = 16 * headPulse;
      ctx.shadowColor = a.color;
      ctx.fillStyle = a.color;
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.arc(head.x, head.y, 2.8 * headPulse, 0, Math.PI * 2);
      ctx.fill();

      // Trailing Spark Dots
      var spark1 = bezier(Math.max(0, et - 0.04));
      ctx.globalAlpha = 0.6;
      ctx.beginPath();
      ctx.arc(spark1.x, spark1.y, 1.8, 0, Math.PI * 2);
      ctx.fill();

      var spark2 = bezier(Math.max(0, et - 0.08));
      ctx.globalAlpha = 0.3;
      ctx.beginPath();
      ctx.arc(spark2.x, spark2.y, 1.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Impact Pulses Shockwaves
    for (var j = pulses.length - 1; j >= 0; j--) {
      var p = pulses[j];
      var tp = (now - p.start) / p.duration;
      if (tp >= 1 || tp < 0) {
        if (tp >= 1) pulses.splice(j, 1);
        continue;
      }
      var rr = 3 + easeOutExpo(tp) * (p.maxRadius || 26);
      ctx.save();
      ctx.globalAlpha = Math.pow(1 - tp, 1.5) * 0.7;
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(p.x, p.y, rr, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // Monitored Nodes & Ambient Node Pulse Rings
    var breathe = reducedMotion ? 0 : Math.sin(now / 900) * 0.5 + 0.5;
    for (var n = 0; n < NODES.length; n++) {
      var node = NODES[n];
      var np = project(node.lat, node.lon, width, height);
      var isHover = hoverNode === node;

      // Ambient Node Pulse Ring Animation
      if (!reducedMotion) {
        var nodePhase = (now / 1600 + n * 0.22) % 1;
        var nodeRadius = 3 + nodePhase * 12;
        ctx.save();
        ctx.globalAlpha = (1 - nodePhase) * 0.35;
        ctx.strokeStyle = isHover ? "#ffffff" : "rgba(0, 242, 255, 0.8)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(np.x, np.y, nodeRadius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      // Core Node Dot
      ctx.save();
      ctx.beginPath();
      ctx.fillStyle = isHover ? "#ffffff" : "rgba(0, 242, 255, " + (0.7 + breathe * 0.3).toFixed(3) + ")";
      ctx.shadowBlur = isHover ? 16 : 8;
      ctx.shadowColor = isHover ? "#ffffff" : "#00f2ff";
      ctx.arc(np.x, np.y, isHover ? 3.8 : 2.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      if (isHover) {
        ctx.save();
        ctx.strokeStyle = "rgba(255,255,255,0.7)";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(np.x, np.y, 9, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }
  }

  // Pointer interaction: hover + drag pan + zoom
  function applyTransform() {
    inner.style.transform = "translate(" + view.tx + "px, " + view.ty + "px) scale(" + view.scale + ")";
    zoomResetBtn.classList.toggle("ltm-hidden", view.scale <= 1.001);
  }

  function clampView(v) {
    var maxOffsetX = (size.width * (v.scale - 1)) / 2 + 40;
    var maxOffsetY = (size.height * (v.scale - 1)) / 2 + 40;
    return {
      scale: v.scale,
      tx: Math.max(-maxOffsetX, Math.min(maxOffsetX, v.tx)),
      ty: Math.max(-maxOffsetY, Math.min(maxOffsetY, v.ty))
    };
  }

  var smoothTimeout = null;
  function withSmoothTransform(fn) {
    inner.classList.add("ltm-inner-smooth");
    fn();
    if (smoothTimeout) clearTimeout(smoothTimeout);
    smoothTimeout = setTimeout(function () {
      inner.classList.remove("ltm-inner-smooth");
    }, 420);
  }

  function zoomBy(factor) {
    withSmoothTransform(function () {
      var nextScale = Math.max(1, Math.min(2.4, view.scale * factor));
      view = clampView({ scale: nextScale, tx: view.tx, ty: view.ty });
      applyTransform();
    });
  }

  function resetView() {
    withSmoothTransform(function () {
      view = { scale: 1, tx: 0, ty: 0 };
      applyTransform();
    });
  }

  zoomInBtn.addEventListener("click", function () { zoomBy(1.35); });
  zoomOutBtn.addEventListener("click", function () { zoomBy(1 / 1.35); });
  zoomResetBtn.addEventListener("click", resetView);
  wrap.addEventListener("dblclick", function () { zoomBy(1.5); });

  function toLocalPoint(clientX, clientY) {
    var rect = wrap.getBoundingClientRect();
    var rawX = clientX - rect.left;
    var rawY = clientY - rect.top;
    return { x: (rawX - view.tx) / view.scale, y: (rawY - view.ty) / view.scale };
  }

  wrap.addEventListener("pointerdown", function (e) {
    if (view.scale <= 1.001) return;
    if (smoothTimeout) clearTimeout(smoothTimeout);
    inner.classList.remove("ltm-inner-smooth");
    dragging = true;
    wrap.classList.add("dragging");
    dragStart = { x: e.clientX, y: e.clientY, tx: view.tx, ty: view.ty };
    wrap.setPointerCapture && wrap.setPointerCapture(e.pointerId);
  });

  wrap.addEventListener("pointermove", function (e) {
    if (dragging) {
      var dx = e.clientX - dragStart.x;
      var dy = e.clientY - dragStart.y;
      view = clampView({ scale: view.scale, tx: dragStart.tx + dx, ty: dragStart.ty + dy });
      applyTransform();
      return;
    }
    var width = size.width, height = size.height;
    var local = toLocalPoint(e.clientX, e.clientY);
    var closest = null;
    var closestDist = 14;
    for (var i = 0; i < NODES.length; i++) {
      var p = project(NODES[i].lat, NODES[i].lon, width, height);
      var d = Math.hypot(p.x - local.x, p.y - local.y);
      if (d < closestDist) { closestDist = d; closest = NODES[i]; }
    }
    hoverNode = closest;
    if (closest) {
      var cp = project(closest.lat, closest.lon, width, height);
      var sx = cp.x * view.scale + view.tx;
      var sy = cp.y * view.scale + view.ty;
      tooltip.style.left = sx + "px";
      tooltip.style.top = sy + "px";
      tooltipTitle.textContent = closest.name;
      tooltip.classList.add("visible");
    } else {
      tooltip.classList.remove("visible");
    }
  });

  function endDrag() {
    dragging = false;
    wrap.classList.remove("dragging");
  }
  wrap.addEventListener("pointerup", endDrag);
  wrap.addEventListener("pointerleave", function () {
    endDrag();
    hoverNode = null;
    tooltip.classList.remove("visible");
  });

  // Boot
  renderCounters();
  resize();
  for (var seed = 0; seed < 10; seed++) {
    spawnAttack();
    var seeded = attacks[attacks.length - 1];
    if (seeded) seeded.start -= Math.random() * seeded.duration;
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
